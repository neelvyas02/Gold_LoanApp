<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Vyas Finance Financial Growth Icon">
  <defs>
    <!-- Rich Metallic 3D Gold Base Gradient -->
    <linearGradient id="vfGold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="20%" stop-color="#F3D063" />
      <stop offset="45%" stop-color="#E5B22D" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="90%" stop-color="#8B6508" />
      <stop offset="100%" stop-color="#5B4002" />
    </linearGradient>

    <!-- Specular Bevel Highlight Gradient -->
    <linearGradient id="vfGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFE89C" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B6508" stop-opacity="0.1" />
    </linearGradient>

    <!-- Dark Shadow Gradient for 3D Bevel -->
    <linearGradient id="vfGoldShadow" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3A2800" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#735307" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Metallic Sheen Fill Gradient -->
    <linearGradient id="vfInnerSheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFEFA6" />
      <stop offset="50%" stop-color="#E1AC25" />
      <stop offset="100%" stop-color="#996F09" />
    </linearGradient>

    <!-- Subtle Ambient Drop Shadow -->
    <filter id="vfSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#vfSoftShadow)">
    <!-- Outer Hexagonal Frame - Layer 1: Outer Rim Shadow Base -->
    <polygon points="100,12 176,56 176,144 100,188 24,144 24,56" fill="none" stroke="url(#vfGoldShadow)" stroke-width="12" stroke-linejoin="round" />

    <!-- Outer Hexagonal Frame - Layer 2: Main 3D Metallic Body -->
    <polygon points="100,12 176,56 176,144 100,188 24,144 24,56" fill="none" stroke="url(#vfGold3D)" stroke-width="10" stroke-linejoin="round" />

    <!-- Outer Hexagonal Frame - Layer 3: Inner Specular Rim -->
    <polygon points="100,16 172,58 172,142 100,184 28,142 28,58" fill="none" stroke="url(#vfGoldHighlight)" stroke-width="2.5" stroke-linejoin="round" opacity="0.85" />

    <!-- FINANCIAL GROWTH BARS & UPWARD ARROW SYMBOL -->
    
    <!-- Bar 1 (Left Growth Bar) -->
    <path d="M 52 142 L 52 110 C 52 108 54 106 56 106 L 68 106 C 70 106 72 108 72 110 L 72 142 Z" fill="url(#vfInnerSheen)" />
    <!-- Bar 1 Top Bevel -->
    <path d="M 52 108 L 62 106 L 72 108 L 68 112 L 56 112 Z" fill="url(#vfGoldHighlight)" opacity="0.9" />

    <!-- Bar 2 (Middle Growth Bar) -->
    <path d="M 80 142 L 80 84 C 80 82 82 80 84 80 L 96 80 C 98 80 100 82 100 84 L 100 142 Z" fill="url(#vfGold3D)" />
    <!-- Bar 2 Top Bevel -->
    <path d="M 80 82 L 90 80 L 100 82 L 96 86 L 84 86 Z" fill="url(#vfGoldHighlight)" opacity="0.9" />

    <!-- Bar 3 (Right High Growth Bar merged into upward stem) -->
    <path d="M 108 142 L 108 62 C 108 60 110 58 112 58 L 124 58 C 126 58 128 60 128 62 L 128 142 Z" fill="url(#vfInnerSheen)" />
    <!-- Bar 3 Top Bevel -->
    <path d="M 108 60 L 118 58 L 128 60 L 124 64 L 112 64 Z" fill="url(#vfGoldHighlight)" opacity="0.9" />

    <!-- Dynamic Upward Growth Arrowhead (Sits atop the ascending bars) -->
    <path d="M 100 32 L 140 70 C 142 72 140 76 136 76 L 126 76 C 124 76 123 75 122 74 L 100 52 L 78 74 C 77 75 76 76 74 76 L 64 76 C 60 76 58 72 60 70 Z" fill="url(#vfGold3D)" />
    <!-- Arrowhead 3D Left Light Facet -->
    <path d="M 100 32 L 60 70 C 58 72 60 76 64 76 L 74 76 L 78 74 L 100 52 Z" fill="url(#vfGoldHighlight)" opacity="0.75" />
    <!-- Arrowhead 3D Center Bevel Line -->
    <line x1="100" y1="32" x2="100" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Base Stability Platform Line -->
    <path d="M 44 148 L 156 148" stroke="url(#vfGoldHighlight)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
